name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check --no-cache src tests

      - name: Run tests
        run: pytest tests -q --tb=short

      - name: Verify lint and tests left no source-tree caches
        run: |
          if find . \
            \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache -o -name .mypy_cache \) \
            -not -path './.venv/*' \
            -print -quit | grep -q .
          then
            echo "A prior CI step created a source-tree cache." >&2
            exit 1
          fi

      - name: Validate package and static mirror
        run: ./scripts/validate.sh

  smoke:
    name: Local product smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Exercise port 8103 product paths
        env:
          CSC_PORT: "8103"
          CSC_PYTHON_BIN: python
        run: ./scripts/smoke.sh
