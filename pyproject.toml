[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-success-coach"
version = "0.1.0"
description = "Human-in-control, explainable coaching for consequential conversations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Conversation Success Coach contributors" }]
keywords = [
    "conversation",
    "coaching",
    "sales",
    "support",
    "recruiting",
    "community",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "defusedxml>=0.7,<1",
    "httpx>=0.27,<1",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
conversation-success-coach = "conversation_success_coach.cli:main"
csc-demo = "conversation_success_coach.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversation_success_coach = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["conversation_success_coach"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
